---
 - name: ELK Setup Play
   hosts: localhost
   gather_facts: false
   
   tasks:
     - name: Checking ELK Stack Deployed Already in K8S
       shell: kubectl get ns | grep -i 'elk-stack'
       register: result
       failed_when: false
       changed_when: false
       #ignore_errors: true

     - name: Deploying ELK stack 
       shell: |
               cd /tmp
               rm -rf Monitoring-And-Logging-K8s
               git clone https://github.com/avi1512/Monitoring-And-Logging-K8s.git
               cd Monitoring-And-Logging-K8s/
               git checkout modify
               kubectl apply -f addons/ELK-stack-K8s/k8s-namespace.yaml -f addons/ELK-stack-K8s/. -f addons/ELK-stack-K8s/filebeat/.
       when: "'elk-stack' not in result.stdout"

     - debug:
         msg: ELK Stack is Already deployed
       when: "'elk-stack' in result.stdout"
