---
 - name: Prometheus And Grafana Stack Setup Play
   hosts: localhost
   gather_facts: false
   
   tasks:
     - name: checking Helm tool is installed or not
       shell: whereis helm | egrep -o "/usr/local/bin/helm|/usr/bin/helm"
       register: out
       failed_when: false
       changed_when: false
     
     - name: Installing Helm tool
       shell: |
               yum install wget -y
               wget https://get.helm.sh/helm-v3.8.3-linux-amd64.tar.gz
               tar -zxf helm-v3.8.3-linux-amd64.tar.gz
               mv linux-amd64/helm /usr/local/bin/
       when: "'helm' not in out.stdout"
  
     - debug:
         msg: Already Helm tool is installed
       when: "'helm' in out.stdout"


     - shell: helm list -A | grep -i prometheus
       ignore_errors: true
       register: out


     - shell: echo 'Prometheus And Grafana Stack is Already deployed'
       ignore_errors: true
       when: "'prometheus' in out.stdout"


     - name: Creating new namespace for Prometheus And Grafana Stack
       command: kubectl create ns monitoring
       ignore_errors: true
       when: "'prometheus' not in out.stdout"

      
     - name: Adding Prometheus repo and updating helm repo
       shell: |
               helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
               helm repo update
               touch /tmp/pvc-prometheus-grafana.yaml
       when: "'prometheus' not in out.stdout"


     - name: Adding PVC for Prometheus and Grafana
       blockinfile:
         dest: /tmp/pvc-prometheus-grafana.yaml
         block:
               |
                prometheus:
                  prometheusSpec:
                    storageSpec:
                      volumeClaimTemplate:
                        spec:
                          #storageClassName: nfs-client
                          accessModes: ["ReadWriteOnce"]
                          resources:
                            requests:
                              storage: 1Gi

                grafana:
                  persistence:
                    type: pvc
                    enabled: true
                    #storageClassName: nfs-client
                    accessModes: ["ReadWriteOnce"]
                    size: 1Gi   
       when: "'prometheus' not in out.stdout"
     

     - name: Installing Prometheus And Grafana
       shell: |
               helm install prometheus prometheus-community/kube-prometheus-stack -f /tmp/pvc-prometheus-grafana.yaml --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false -n monitoring
       when: "'prometheus' not in out.stdout"
   

     - name: Replace Grafana Service ClusterIP To NodePort
       shell: "kubectl get svc prometheus-grafana -n monitoring -o yaml | sed 's/type: ClusterIP/type: NodePort/g' | kubectl replace -f -"
       when: "'prometheus' not in out.stdout"


     - name: Replace Promethus-Alertmanager Service ClusterIP To NodePort
       shell: "kubectl get svc prometheus-kube-prometheus-alertmanager -n monitoring -o yaml | sed 's/type: ClusterIP/type: NodePort/g' | kubectl replace -f -"
       when: "'prometheus' not in out.stdout"


     - name: Replace Promethus Service ClusterIP To NodePort
       shell: "kubectl get svc prometheus-kube-prometheus-prometheus -n monitoring -o yaml | sed 's/type: ClusterIP/type: NodePort/g' | kubectl replace -f -"
       when: "'prometheus' not in out.stdout"


     - name: Verify Installation
       shell: |
               helm list -A
       register: outs
     - debug: var=outs.stdout_lines


     - name: MSG
       shell: |
               echo "If Prometheus operator and Prometheus instance was installed through helm chart and if you want to use thanos remote write then. !!! Please make sure remote wrtie API configured in prometheus instance 
               #### kubectl edit prom -n monitoring ####
               Add remoteWrite: - url: http://receiver-write.monitoring.svc.cluster.local:10908/api/v1/receive under prometheus spec"
       register: outs
     - debug: var=outs.stdout_lines
